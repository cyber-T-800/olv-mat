<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Úprava eventu</title>
    <link rel="stylesheet" href="/stylesheet.css">
</head>
<body>
<div class="obal obal-static">
    <a href="/admin/events" class="button big white">Späť na prehľad eventov</a>
    <h1>Úprava eventu</h1>
    <form th:object="${eventEditForm}" id="form" action="/admin/event" method="post">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" id="popisInput" th:field="*{description}"/>
        <label for="name">Názov:</label>
        <input type="text" id="name" name="name" th:field="*{name}" required>

        <label for="description">Popis:</label>
        <div contenteditable="true" id="description" style="border: 1px solid black;" th:utext="*{description}">
            <h1>Názov udalosti</h1>
            <p>
                Bla bla bla
            </p>
        </div>
        <button type="submit" class="button big blue" onclick="save(event)">Uložiť</button>
    </form>

</div>
</body>
<script type="text/javascript">
    let save = function (event){
        event.preventDefault();
        document.getElementById("popisInput").value = document.getElementById("description").innerHTML;
        document.getElementById("form").submit()
    }
</script>
</html>
